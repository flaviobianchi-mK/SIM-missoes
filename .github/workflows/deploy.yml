name: Deploy para Hostinger

on:
  workflow_dispatch:  # Apenas disparo manual — via Actions > Run workflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requer aprovação antes de executar

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Enviar arquivos via FTP
        env:
          FTP_PASS: ${{ secrets.FTPPASSW }}
          FTP_USER: ${{ secrets.FTPUSER }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp://ftp.grey-sheep-571288.hostingersite.com \
            -e "set ftp:ssl-allow no; set net:timeout 30; mirror -R --delete --no-perms --exclude-glob .git --exclude-glob .github --exclude-glob CLAUDE.md --exclude-glob SKILLS --exclude-glob '*.md' . /home/u231680863/domains/grey-sheep-571288.hostingersite.com/public_html; quit"
