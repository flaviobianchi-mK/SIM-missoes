name: Deploy para Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Enviar arquivos via FTP
        env:
          FTP_PASS: ${{ secrets.FTPPASSW }}
        run: |
          lftp -u u231680863.flaviopbianchi,"$FTP_PASS" ftp://ftp.grey-sheep-571288.hostingersite.com \
            -e "set ftp:ssl-allow no; set net:timeout 30; mirror -R --delete --no-perms --exclude-glob .git --exclude-glob .github --exclude-glob CLAUDE.md --exclude-glob SKILLS --exclude-glob '*.md' . public_html; quit"
